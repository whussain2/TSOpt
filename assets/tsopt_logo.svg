<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 120" width="236" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A3FA0"/>
      <stop offset="1" stop-color="#0F9D8E"/>
    </linearGradient>
  </defs>
  <!-- a grid of candidates, a few chosen (the training set) -->
