    <g fill="#C4C8CF">
      <circle cx="6" cy="6" r="5"/><circle cx="22" cy="6" r="5"/><circle cx="38" cy="6" r="5"/><circle cx="54" cy="6" r="5"/>
      <circle cx="6" cy="22" r="5"/><circle cx="38" cy="22" r="5"/><circle cx="54" cy="22" r="5"/>
      <circle cx="6" cy="38" r="5"/><circle cx="22" cy="38" r="5"/><circle cx="54" cy="38" r="5"/>
      <circle cx="22" cy="54" r="5"/><circle cx="38" cy="54" r="5"/>
    </g>
    <g fill="url(#g)">
      <circle cx="22" cy="22" r="6.5"/><circle cx="38" cy="38" r="6.5"/><circle cx="6" cy="54" r="6.5"/><circle cx="54" cy="54" r="6.5"/>
    </g>
    <!-- seedling rising from the selected set -->
