name: 🐞 Bug report
description: Something in TSOpt does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. **Do not include your licence key or confidential data.** A small example with
        `tso_simulate_panel()` is ideal.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce it
      render: r
  - type: textarea
    id: message
    attributes:
      label: The full error or warning message
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of: packageVersion('TSOpt'); R.version.string; Sys.info()[['sysname']]"
    validations:
      required: true
