  <text x="104" y="62" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#g)">TSOpt</text>
  <text x="105" y="84" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5E6670">Training-set design</text>
